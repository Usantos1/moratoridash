# Nginx — app.muratorimkt.com.br (SPA + API + SSL)
# Copie para /etc/nginx/sites-available/muratori-api

server {
    listen 80;
    listen [::]:80;
    server_name app.muratorimkt.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.muratorimkt.com.br;

    ssl_certificate     /etc/letsencrypt/live/app.muratorimkt.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.muratorimkt.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/muratori/apps/web/dist;
    index index.html;

    # Segurança básica
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_pass http://127.0.0.1:3340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:3340;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
