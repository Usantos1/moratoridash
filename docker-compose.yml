services:
  postgres:
    image: postgres:16-alpine
    container_name: muratori-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-muratori}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muratori_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-muratori_dash}
    volumes:
      - muratori_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-muratori} -d ${POSTGRES_DB:-muratori_dash}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  muratori_pg_data:
